[package]
name = "banc-platform"
description = "All OS-specific code: paths, signals, logs, then services, elevation and fonts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gethostname.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "macros", "net", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
# The session helper's tray icon (macOS and Windows).
tray = ["dep:tray-icon", "dep:tao", "tokio/rt"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
keyring-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store.workspace = true
windows-service.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "io-util"] }
