[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri application is its own workspace: building it needs webkit2gtk
# on Linux, which the checks of the other crates must not depend on.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "LicenseRef-Proprietary"
repository = "https://github.com/JulesMellot/Banc"

[workspace.dependencies]
banc-blobs = { path = "crates/banc-blobs" }
banc-platform = { path = "crates/banc-platform" }
banc-proto = { path = "crates/banc-proto" }
banc-resolve = { path = "crates/banc-resolve" }
banc-tunnel = { path = "crates/banc-tunnel" }

anyhow = "1.0.104"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
bao-tree = { version = "0.17.0", default-features = false, features = ["tokio_fsm"] }
blake3 = "1.8.7"
bytes = "1.12.2"
clap = { version = "4", features = ["derive"] }
data-encoding = "2.11.1"
futures-util = { version = "0.3", default-features = false }
gethostname = "1.1.0"
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
include_dir = "0.7.4"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
# The io traits of bao-tree, without their tokio adapters.
iroh-io = { version = "0.6.2", default-features = false }
iroh-relay = { version = "1.4.1", default-features = false, features = ["server"] }
keyring-core = "1.0.1"
lexopt = "0.3.2"
positioned-io = { version = "0.3.5", default-features = false }
# HTTPS client of the agent, with rustls and the ring provider that iroh
# already brings.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# rusqlite follows the version accepted by rusqlite_migration.
rusqlite = { version = "0.41.0", features = ["bundled"] }
rusqlite_migration = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tao = { version = "0.37.2", default-features = false }
tokio = { version = "1.54.1", default-features = false }
toml = "1.2.1"
tower = { version = "0.5.3", default-features = false }
# Without the `#[instrument]` macro, which pulls in a second version of `syn`.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tray-icon = { version = "0.26.1", default-features = false }
windows-native-keyring-store = "1.1.0"
windows-service = "0.8.1"
windows-sys = "0.61.2"
# Plugins and fonts are delivered as archives. Deflate only: what every zip
# tool writes.
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
# CLAUDE.md: no `unwrap()` or `expect()` outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
# Optimized for size: the agent's code pages count in its resident memory
# at rest (section 10 of the plan). Fat LTO and "s" take the agent binary
# from 13 MB to 7.5 MB.
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"

# Speed where it is the point: password and file hashing.
[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3
