# banc-server configuration.
# Start with: banc-server --config /etc/banc/banc-server.toml
# A relative path starts from this file's folder. An unknown key is refused.

# Server data folder: the SQLite database (banc.sqlite) is created there.
data_dir = "/var/lib/banc"

[logs]
# Log folder, one file per day. Default: /var/log/banc.
# dir = "/var/log/banc"

# Level: error, warn, info, debug or trace.
level = "info"

# Number of days of logs kept.
keep_days = 30
