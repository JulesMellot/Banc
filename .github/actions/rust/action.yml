name: Rust
description: Installs the Rust toolchain from rust-toolchain.toml and restores the build cache.
inputs:
  targets:
    description: Extra targets, separated by spaces.
    default: ''
  cache-key:
    description: Key that tells apart the caches of different jobs.
    default: ''
runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install
        if [ -n "$TARGETS" ]; then
          rustup target add $TARGETS
        fi
        rustc --version
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
