# The window with the agent and the session helper: the installers, and the
# files of an update. Called by release.yml, run by hand from the Actions tab,
# or by a PR that changes how they are built.
name: Bundles

on:
  workflow_call:
    inputs:
      version:
        description: Version number of the bundles.
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bundles.yml
      - crates/xtask/src/dist.rs
      - crates/xtask/src/release.rs
      - ui/src-tauri/bundle.conf.json
      - ui/src-tauri/installer-hooks.nsh
      - ui/src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            files: |
              ui/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-x86_64
            os: macos-15-intel
            files: |
              ui/src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x86_64
            os: windows-latest
            files: |
              ui/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache-key: bundle
          workspaces: |
            . -> target
            ui/src-tauri -> target
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Bundle
        shell: bash
        env:
          # Ad-hoc signature: Apple silicon refuses a bundle without one.
          APPLE_SIGNING_IDENTITY: "-"
          VERSION: ${{ inputs.version }}
        run: cargo xtask bundle-app --payload payload ${VERSION:+--version "$VERSION"}
      - name: Check the signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 ui/src-tauri/target/release/bundle/macos/Banc.app
      - uses: actions/upload-artifact@v7
        with:
          name: banc-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.name }}
          path: payload
          if-no-files-found: error
          retention-days: 30
