# On every PR and every PR update: all of ci.yml, plus what costs more.
# `PR prête` is the check required by the protection of main.
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plateformes:
    uses: ./.github/workflows/plateformes.yml

  repos:
    name: Idle measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - run: cargo xtask idle-bench

  # To be wired up once the product exists (see docs/ci.md):
  # end-to-end integration tests, server + depot + two agents.

  prete:
    name: PR prête
    if: always()
    needs: [ci, plateformes, repos]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all checks succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
