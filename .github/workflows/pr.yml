# On every PR and every PR update: all of ci.yml, plus what costs more.
# `PR ready` is the check required by the protection of main.
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  platforms:
    uses: ./.github/workflows/platforms.yml

  idle:
    name: Idle measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - run: cargo xtask idle-bench

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f packaging/server/Dockerfile -t banc-server:latest .
      - run: packaging/server/smoke-test.sh

  update:
    name: Update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache-key: update
      - run: cargo xtask update-e2e --build
      - name: Run a real update
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/debug/xtask.exe update-e2e --run
          else
            sudo target/debug/xtask update-e2e --run
          fi

  # To be wired up once the product exists (see docs/ci.md):
  # end-to-end integration tests, server + depot + two agents.

  ready:
    name: PR ready
    if: always()
    needs: [ci, platforms, idle, server-image, update]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all checks succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
