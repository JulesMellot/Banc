# Publishes the server image, for amd64 and arm64, from main and version tags.
name: Server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}

env:
  IMAGE: ghcr.io/julesmellot/banc-server

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build
        run: docker build -f packaging/server/Dockerfile -t "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}" .
      - name: Check
        run: packaging/server/smoke-test.sh "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"
      - name: Push
        run: docker push "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Publish the two architectures under one name
        run: |
          tag=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
          fi
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:${GITHUB_SHA}-amd64" "$IMAGE:${GITHUB_SHA}-arm64"
