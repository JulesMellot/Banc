# Contrôles rapides, sur Linux, à chaque push sur toute branche.
# Chaque job appelle `cargo xtask check <étape>` : la définition des contrôles
# est dans crates/xtask, la même en local et ici. pr.yml réutilise ce fichier.
name: CI

on:
  push:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (format, clippy, tests, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo xtask check fmt architecture clippy tests migrations

  frontend:
    name: Frontend (lint, svelte-check, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo xtask check frontend

  python:
    name: Scripts Python (ruff, compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - run: pipx install ruff==0.16.9
      - run: cargo xtask check python

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask check deny

  depot:
    name: Secrets et messages de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : les deux contrôles portent sur origin/main..HEAD.
          fetch-depth: 0
      - uses: ./.github/actions/rust
      - name: Installer gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: cargo xtask check secrets commits
