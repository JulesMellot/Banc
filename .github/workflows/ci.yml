# Fast checks, on Linux, on every push to any branch.
# Each job calls `cargo xtask check <step>`: the checks are defined in
# crates/xtask, the same locally and here. pr.yml reuses this file.
name: CI

on:
  push:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (format, clippy, tests, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo xtask check fmt architecture clippy tests migrations

  frontend:
    name: Frontend (lint, svelte-check, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo xtask check frontend

  python:
    name: Python scripts (ruff, compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - run: pipx install ruff==0.16.9
      - run: cargo xtask check python

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask check deny

  history:
    name: Secrets and commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: both checks cover origin/main..HEAD.
          fetch-depth: 0
      - uses: ./.github/actions/rust
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: cargo xtask check secrets commits
