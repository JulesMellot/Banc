# Chaque nuit sur main : matrice complète, failles du jour, et une issue
# ouverte en cas d'échec.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plateformes:
    uses: ./.github/workflows/plateformes.yml
    with:
      linux: true

  failles:
    name: Failles connues (base du jour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  # À brancher en phase 3 (voir docs/ci.md) : tests d'intégration longs,
  # gros fichiers, coupure réseau simulée pendant un transfert, reprise.

  alerte:
    name: Ouvrir une issue en cas d'échec
    if: failure() && github.event_name == 'schedule'
    needs: [plateformes, failles]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Échec des contrôles de nuit"
          body="Les contrôles de nuit ont échoué sur main : $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
