# Every night on main: full matrix, the day's advisories, and an issue
# opened on failure.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
    with:
      linux: true

  advisories:
    name: Known vulnerabilities (today's database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  # To be wired up in phase 3 (see docs/ci.md): long integration tests,
  # large files, network cut simulated during a transfer, resume.

  alert:
    name: Open an issue on failure
    if: failure() && github.event_name == 'schedule'
    needs: [platforms, advisories]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly checks failed"
          body="The nightly checks failed on main: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
