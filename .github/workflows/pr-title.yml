# A PR title becomes the commit message on main (squash merge), so it
# follows the same convention as commits. Separate from pr.yml so that a
# corrected title does not rerun the three-OS matrix.
# The job name `PR title` is a required check in the main ruleset.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    # Dependabot keeps its own format, as for commits.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cargo xtask pr-title "$TITLE"
